 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counting Loop</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 14px 0;
      font-family: Consolas, monospace;
      font-size: 1.3rem;
    }

    .line {
      padding: 4px 18px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }

    .right { display: flex; flex-direction: column; gap: 18px; }

    .boxes { display: flex; gap: 14px; flex-wrap: wrap; }

    .box {
      flex: 1;
      min-width: 140px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 10px 14px;
      text-align: center;
    }

    .box .k { color: var(--muted); font-weight: 700; }
    .box .v { font-family: Consolas, monospace; font-size: 2.2rem; font-weight: 700; min-height: 1.3em; }
    .box.yes .v { color: var(--green); }
    .box.no .v { color: var(--red); }

    .console {
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px 16px;
      font-family: Consolas, monospace;
      font-size: 1.3rem;
      min-height: 11.5em;
    }

    .console .k { color: #94a3b8; font-size: 0.9rem; margin-bottom: 6px; font-family: Inter, system-ui, Arial, sans-serif; font-weight: 700; }
    .console .out { padding: 1px 0; }
    .console .out.new { color: #86efac; }

    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; }
      .code, .console { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>A loop counts, one number at a time</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="right">
      <div class="boxes">
        <div class="box" id="box-i"><div class="k">i</div><div class="v" id="v-i"></div></div>
        <div class="box" id="box-check"><div class="k">keep going?</div><div class="v" id="v-check"></div></div>
      </div>
      <div class="console" id="console"></div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const countCode = [
      "for (let i = 1; i <= 5; i++) {",
      "  console.log(i);",
      "}",
      "",
      "console.log(\"Done!\");"
    ];
    const zeroCode = [
      "for (let i = 0; i < 5; i++) {",
      "  console.log(i);",
      "}",
      "",
      ""
    ];

    // Each step: caption, code + highlighted line, i, the check, and what's printed so far.
    const steps = [
      { text: "A <strong>loop</strong> runs the same code over and over. This one should print the numbers 1 to 5.",
        code: countCode, out: [] },
      { text: "<strong>Start:</strong> <code>let i = 1</code>. <code>i</code> is our counter.",
        code: countCode, line: 0, i: "1", out: [] },
      { text: "<strong>Check:</strong> is 1 <code>&lt;=</code> 5? Yes, so go inside the loop.",
        code: countCode, line: 0, i: "1", check: "1 <= 5 ✔", ok: true, out: [] },
      { text: "<strong>Run the inside:</strong> <code>console.log(i)</code> prints <strong>1</strong>.",
        code: countCode, line: 1, i: "1", out: ["1"] },
      { text: "<strong>Step:</strong> <code>i++</code> adds 1, so <code>i</code> is 2. Check again: 2 <code>&lt;=</code> 5? Yes.",
        code: countCode, line: 0, i: "2", check: "2 <= 5 ✔", ok: true, out: ["1"] },
      { text: "Print <strong>2</strong>. Start, check, run, step... the same 3 moves every time round.",
        code: countCode, line: 1, i: "2", out: ["1", "2"] },
      { text: "<code>i</code> is 3. Check passes. Print <strong>3</strong>.",
        code: countCode, line: 1, i: "3", check: "3 <= 5 ✔", ok: true, out: ["1", "2", "3"] },
      { text: "<code>i</code> is 4. Print <strong>4</strong>.",
        code: countCode, line: 1, i: "4", check: "4 <= 5 ✔", ok: true, out: ["1", "2", "3", "4"] },
      { text: "<code>i</code> is 5. Is 5 <code>&lt;=</code> 5? Yes, <strong>equal counts</strong>. Print <strong>5</strong>.",
        code: countCode, line: 1, i: "5", check: "5 <= 5 ✔", ok: true, out: ["1", "2", "3", "4", "5"] },
      { text: "<code>i++</code> makes it 6. Is 6 <code>&lt;=</code> 5? <strong>No.</strong> The loop stops. 6 never prints.",
        code: countCode, line: 0, i: "6", check: "6 <= 5 ✖", ok: false, out: ["1", "2", "3", "4", "5"] },
      { text: "The code <strong>after</strong> the loop runs once: <strong>Done!</strong>",
        code: countCode, line: 4, out: ["1", "2", "3", "4", "5", "Done!"] },
      { text: "<strong>Predict:</strong> now <code>i</code> starts at <strong>0</strong> and the check is <code>&lt; 5</code>. What prints? Type it in the chat.",
        code: zeroCode, line: 0, out: [] },
      { text: "<strong>0, 1, 2, 3, 4.</strong> Still 5 numbers, but 5 itself doesn't print: 5 <code>&lt;</code> 5 is false. This is the loop we use for <strong>lists</strong>, because lists start at 0.",
        code: zeroCode, line: 0, i: "5", check: "5 < 5 ✖", ok: false, out: ["0", "1", "2", "3", "4"], showAll: true }
    ];

    function el(id) { return document.getElementById(id); }

    let step = 0;

    function show() {
      const s = steps[step];
      const before = step > 0 && !s.showAll ? steps[step - 1].out.length : 0;

      el("code").innerHTML = "";
      s.code.forEach(function (text, n) {
        const line = document.createElement("div");
        line.className = "line" + (n === s.line ? " on" : "");
        line.textContent = text || " ";
        el("code").appendChild(line);
      });

      el("v-i").textContent = s.i || "";
      el("v-check").textContent = s.check || "";
      el("box-check").classList.toggle("yes", s.ok === true);
      el("box-check").classList.toggle("no", s.ok === false);

      el("console").innerHTML = '<div class="k">Console</div>';
      s.out.forEach(function (text, n) {
        const line = document.createElement("div");
        line.className = "out" + (n >= before && !s.showAll ? " new" : "");
        line.textContent = text;
        el("console").appendChild(line);
      });

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });

    show();
  </script>
</body>
</html>
